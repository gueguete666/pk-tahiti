<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PK Tahiti</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f2f2f2;
}

h1 {
    text-align:center;
    font-size:32px;
}

#map {
    height:40vh;
    width:100%;
}

.info {
    background:white;
    margin:10px;
    padding:15px;
    border-radius:12px;
    font-size:23px;
}

.valeur {
    font-weight:bold;
}

</style>

</head>


<body>

<h1>📍 PK Tahiti</h1>


<div id="map"></div>


<div class="info">
🛣️ Axe :
<br>
<span class="valeur" id="axe">Recherche...</span>
</div>


<div class="info">
📍 PK :
<br>
<span class="valeur" id="pk">Recherche...</span>
</div>


<div class="info">
⬆️ Sens :
<br>
<span class="valeur" id="sens">Recherche...</span>
</div>


<div class="info">
🏘️ Commune :
<br>
<span class="valeur" id="commune">Recherche...</span>
</div>


<div class="info">
🏛️ Chef-lieu :
<br>
<span class="valeur" id="chef">Recherche...</span>
</div>



<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<script>


// Création carte

let carte = L.map('map')
.setView([-17.55,-149.55],14);


L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'OpenStreetMap'
}
).addTo(carte);



let marqueur = L.marker([-17.55,-149.55])
.addTo(carte);



// Chargement des données routes

let routes = [];


fetch("donnees/routes.json")

.then(response => response.json())

.then(data => {

routes = data.axes;

document.getElementById("axe").innerHTML =
routes[0].nom;

})

.catch(() => {

document.getElementById("axe").innerHTML =
"Erreur données routes";

});




// GPS

function positionGPS(position){


let latitude = position.coords.latitude;

let longitude = position.coords.longitude;



marqueur.setLatLng([
latitude,
longitude
]);


carte.setView([
latitude,
longitude
]);



// Affichage test

document.getElementById("pk").innerHTML =
"En attente des PK";


document.getElementById("sens").innerHTML =
"---";


document.getElementById("commune").innerHTML =
"En attente";


document.getElementById("chef").innerHTML =
"En attente";


}



function erreurGPS(){

alert("GPS indisponible");

}



navigator.geolocation.watchPosition(

positionGPS,

erreurGPS,

{
enableHighAccuracy:true
}

);



</script>


</body>

</html>
