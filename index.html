<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PK Tahiti</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;
}

h1 {
    font-size: 35px;
}

.info {
    font-size: 22px;
    margin: 15px;
}
</style>

</head>

<body>

<h1>📍 PK Tahiti</h1>

<div class="info">
Latitude : <span id="latitude">En attente...</span>
</div>

<div class="info">
Longitude : <span id="longitude">En attente...</span>
</div>

<div class="info">
Vitesse : <span id="vitesse">En attente...</span>
</div>

<div class="info">
Précision GPS : <span id="precision">En attente...</span>
</div>

<div class="info">
🏘️ Commune : <span id="commune">Recherche...</span>
</div>

<div class="info">
🏛️ Chef-lieu : <span id="chef-lieu">Recherche...</span>
</div>


<script>

function obtenirPosition(position) {

    document.getElementById("latitude").innerHTML =
    position.coords.latitude;

    document.getElementById("longitude").innerHTML =
    position.coords.longitude;

    let vitesse = position.coords.speed;

    if (vitesse) {
        vitesse = (vitesse * 3.6).toFixed(1) + " km/h";
    } else {
        vitesse = "0 km/h";
    }

    document.getElementById("vitesse").innerHTML = vitesse;

    document.getElementById("precision").innerHTML =
    Math.round(position.coords.accuracy) + " mètres";


    // Test temporaire avant intégration des vraies données
    document.getElementById("commune").innerHTML = "Faaa";
    document.getElementById("chef-lieu").innerHTML = "Faaa";
}


function erreurGPS() {
    alert("Impossible d'obtenir la position GPS");
}


navigator.geolocation.watchPosition(
    obtenirPosition,
    erreurGPS,
    {
        enableHighAccuracy: true
    }
);

</script>

</body>
</html>
