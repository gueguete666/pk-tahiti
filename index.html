<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PK Tahiti</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

body {
    font-family: Arial, sans-serif;
    margin: 0;
    background:#f2f2f2;
}

h1 {
    text-align:center;
    font-size:32px;
}

#map {
    height:40vh;
}

.info {
    background:white;
    margin:10px;
    padding:15px;
    border-radius:12px;
    font-size:22px;
}

.valeur {
    font-weight:bold;
}

</style>

</head>


<body>

<h1>📍 PK Tahiti</h1>


<div id="map"></div>


<div class="info">
🛣️ Axe :
<br>
<span class="valeur" id="axe">Recherche...</span>
</div>


<div class="info">
📍 PK :
<br>
<span class="valeur" id="pk">Recherche...</span>
</div>


<div class="info">
⬆️ Sens :
<br>
<span class="valeur" id="sens">Recherche...</span>
</div>


<div class="info">
🏘️ Commune :
<br>
<span class="valeur" id="commune">Recherche...</span>
</div>


<div class="info">
🏛️ Chef-lieu :
<br>
<span class="valeur" id="chef">Recherche...</span>
</div>



<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<script>


let carte = L.map('map')
.setView([-17.55,-149.55],14);


L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png'
)
.addTo(carte);


let marqueur = L.marker([-17.55,-149.55])
.addTo(carte);



let listePK = [];


// Chargement des PK

fetch("donnees/pk.json")

.then(response => response.json())

.then(data => {

listePK = data.pk;

})

.catch(()=>{

alert("Erreur chargement PK");

});



// Calcul distance entre deux points GPS

function distance(lat1, lon1, lat2, lon2){

let R = 6371000;

let dLat = (lat2-lat1)*Math.PI/180;

let dLon = (lon2-lon1)*Math.PI/180;


let a =
Math.sin(dLat/2)**2 +
Math.cos(lat1*Math.PI/180) *
Math.cos(lat2*Math.PI/180) *
Math.sin(dLon/2)**2;


return R * 2 * Math.atan2(
Math.sqrt(a),
Math.sqrt(1-a)
);

}



// Recherche PK le plus proche

function chercherPK(lat,lon){


if(listePK.length===0){
return;
}


let meilleur = listePK[0];

let distanceMin = distance(
lat,
lon,
meilleur.latitude,
meilleur.longitude
);



listePK.forEach(point=>{


let d = distance(
lat,
lon,
point.latitude,
point.longitude
);


if(d < distanceMin){

distanceMin = d;
meilleur = point;

}


});



document.getElementById("axe").innerHTML =
meilleur.axe;


document.getElementById("pk").innerHTML =
meilleur.numero;


document.getElementById("sens").innerHTML =
meilleur.sens;


document.getElementById("commune").innerHTML =
meilleur.commune;


document.getElementById("chef").innerHTML =
meilleur.chef_lieu;


}



function positionGPS(position){


let lat = position.coords.latitude;

let lon = position.coords.longitude;


marqueur.setLatLng([lat,lon]);


carte.setView([lat,lon]);


chercherPK(lat,lon);


}



navigator.geolocation.watchPosition(

positionGPS,

function(){
alert("GPS indisponible");
},

{
enableHighAccuracy:true
}

);


</script>


</body>

</html>
