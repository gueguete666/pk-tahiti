<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PK Tahiti</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f5f5f5;
}

h1 {
    text-align:center;
    font-size:32px;
}

#map {
    height:40vh;
    width:100%;
}

.info {
    background:white;
    margin:10px;
    padding:15px;
    border-radius:10px;
    font-size:24px;
}

.valeur {
    font-weight:bold;
}

</style>

</head>


<body>


<h1>📍 PK Tahiti</h1>


<div id="map"></div>


<div class="info">
🛣️ Axe :
<br>
<span class="valeur" id="axe">
Recherche...
</span>
</div>


<div class="info">
📍 PK :
<br>
<span class="valeur" id="pk">
Recherche...
</span>
</div>


<div class="info">
⬆️ Sens :
<br>
<span class="valeur" id="sens">
Recherche...
</span>
</div>


<div class="info">
🏘️ Commune :
<br>
<span class="valeur" id="commune">
Recherche...
</span>
</div>


<div class="info">
🏛️ Chef-lieu :
<br>
<span class="valeur" id="chef">
Recherche...
</span>
</div>



<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<script>


let carte = L.map('map')
.setView([-17.55,-149.55],14);


L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png'
)
.addTo(carte);



let marqueur = L.marker([-17.55,-149.55])
.addTo(carte);



function positionGPS(position){


let lat = position.coords.latitude;
let lon = position.coords.longitude;


marqueur.setLatLng([lat,lon]);

carte.setView([lat,lon]);


// Données temporaires

document.getElementById("axe").innerHTML =
"En attente des données routes";


document.getElementById("pk").innerHTML =
"En attente des PK";


document.getElementById("sens").innerHTML =
"---";


document.getElementById("commune").innerHTML =
"Faaa (test)";


document.getElementById("chef").innerHTML =
"Faaa (test)";


}



navigator.geolocation.watchPosition(
positionGPS,
function(){
alert("GPS indisponible");
},
{
enableHighAccuracy:true
}
);


</script>


</body>

</html>
